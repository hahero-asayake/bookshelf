name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check:version がbase/headのindex.htmlをgit showで読むため全履歴が要る
          # (イシュー#390・既定のshallow checkoutだとbase側が無くて解決できない)。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version bump check (?v=・イシュー#390)
        run: |
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            echo "[ci] check:version: 比較起点が無い(新規ブランチ/初回push)ため版バンプ検査をスキップする。"
            exit 0
          fi
          CHECK_VERSION_RANGE="${BASE}..${HEAD}" npm run check:version
      - name: CSS lint (stylelint)
        run: npm run lint:css
      - name: Unit tests (Vitest)
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (Playwright)
        run: npm run test:e2e
      - name: E2E 失敗テスト一覧 (annotation 補完・イシュー#349)
        if: always()
        run: npm run ci:annotate-e2e
