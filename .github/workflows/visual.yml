name: Visual

# イシュー#527: visual(画像比較・tests/visual/screens.spec.js、playwright.visual.config.js)を
# CI に入れられるかを実測で決めるための試験ジョブ。
#
# イシュー#728: 基準画像66枚(tests/visual/__screenshots__/*-linux.png)は Playwright 公式コンテナ
# (scripts/verify/visual-image.mjs のイメージ)の中で撮る。CI も同じイメージの中で流す。ランナーの素の環境と
# 手元とでは日本語の書体が違い、54件とも差分になっていた(scripts/verify/728-results.md §1)。
# イメージの版は package-lock.json の @playwright/test と揃える(tests/unit/visual-image.test.js が検査する)。
#
# on.push.paths は、画像比較の絵に効くファイル (アプリの UI・テスト・基準画像・設定) に絞る (#728 ②決定)。
# UI を変えて基準画像を撮り直し忘れた push はここで赤になる (#524 型)。撮り直しは
# `PORT=8112 node scripts/verify/visual-docker.mjs -g "<テスト名>" --update-snapshots` (tests/visual/README.md)。
# workflow_dispatch も残すが、未認証環境からは起動できない。
#
# .github/workflows/ci.yml は一切変更しない。別ファイル・別ワークフローなので、このジョブの
# 合否は ci.yml の結果にも、ブランチ保護にも影響しない。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual.yml'
      - 'tests/visual/**'
      - 'playwright.visual.config.js'
      - 'js/**'
      - 'css/**'
      - 'index.html'
  workflow_dispatch:

jobs:
  visual:
    # OS は版で固定する (ci.yml と同じ・#713)。絵はコンテナの中で決まる。
    runs-on: ubuntu-26.04
    # イメージのタグは scripts/verify/visual-image.mjs と同じにする (tests/unit/visual-image.test.js)。
    # --user 1001 はランナーの作業ディレクトリの持ち主に合わせる。--ipc=host は Chromium の共有メモリ用。
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-resolute
      options: --user 1001 --ipc=host
    # #728: 同じ commit を2本流して2本とも 0/54 だった (run 44956190046) ので、1本に戻し、
    # continue-on-error も外した (差分が出たら Visual が赤になる)。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: npm_ci
        run: npm ci
      # どの書体で描いたかを annotation に残す (イシュー#527/#728)。
      - name: フォント確認 (コンテナの中)
        if: ${{ !cancelled() && steps.npm_ci.outcome == 'success' }}
        run: |
          export FONT_CHECK_OUT="$(fc-match sans-serif:lang=ja)"
          node -e "const s=process.env.FONT_CHECK_OUT||''; const esc=s.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'); console.log('::notice title=フォント確認::'+esc)"
      # 差分が出たらこの step が落ちてジョブが赤になる (#728)。後続の要約と artifact 保存は
      # !cancelled() で落ちた後も流す。JSON出力先はoutputDir
      # (test-results-visual/、既定でPlaywrightがテスト開始時にクリアする)の外にする。
      - name: Visual tests (Playwright, 9画面×6端末)
        id: run_visual
        if: ${{ !cancelled() && steps.npm_ci.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: visual-results.json
        run: npx playwright test -c playwright.visual.config.js --reporter=list,json
      - name: visual 結果の要約 (annotation + step summary・イシュー#527)
        if: ${{ !cancelled() && steps.run_visual.outcome != 'skipped' }}
        run: node scripts/ci-visual-summary.mjs visual-results.json
      - name: 差分画像・結果をartifactへ保存 (イシュー#527)
        if: ${{ !cancelled() && steps.run_visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            test-results-visual/
            visual-results.json
          retention-days: 14
          if-no-files-found: warn
