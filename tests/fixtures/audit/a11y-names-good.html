<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名前の無い部品の見本（正しい形）</title>
</head>
<body>
<main>
<h1>名前のある部品の見本</h1>
<p><button id="ok-button" type="button" aria-label="閉じる"><svg aria-hidden="true" width="16" height="16"><rect width="16" height="16"/></svg></button></p>
<p><button id="ok-title" type="button" title="並べ替え"><svg aria-hidden="true" width="16" height="16"><rect width="16" height="16"/></svg></button></p>
<p><button id="ok-text" type="button">保存</button></p>
<p><img id="ok-img" alt="本の表紙" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="20" height="20"></p>
<p><label for="ok-input">名前</label> <input id="ok-input" type="text"></p>
<p><input id="ok-search" type="text" placeholder="検索" aria-label="検索"></p>
<p><a id="ok-link" href="#x">設定を開く</a></p>
<p><label>並び順 <select id="ok-select"><option>新しい順</option></select></label></p>
<p><input id="ok-submit" type="submit"></p>
</main>
</body>
</html>
