<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボタン名の見本（画面A）</title>
</head>
<body>
<main>
<h1>画面A</h1>
<p><button id="dlg-close" type="button">閉じる</button></p>
<p><button data-act="edit" type="button">編集</button></p>
<p><button type="button">その他の操作</button></p>
<p><button id="form-cancel" type="button">キャンセル</button></p>
<div class="cfm-actions">
<button class="cfm-cancel" type="button">キャンセル</button>
<button class="cfm-ok" type="button">削除する</button>
</div>
</main>
</body>
</html>
