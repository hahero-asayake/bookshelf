<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボタン名の見本（画面B・誤り入り）</title>
</head>
<body>
<main>
<h1>画面B</h1>
<!-- 誤り: 画面A の「閉じる」と同じ操作なのに「とじる」 -->
<p><button id="panel-close" type="button">とじる</button></p>
<p><button class="modal-close" type="button" aria-label="閉じる">×</button></p>
<p><button data-act="edit" type="button">編集</button></p>
<p><button id="edit-cancel" type="button">キャンセル</button></p>
<div class="cfm-actions">
<button class="cfm-cancel" type="button">キャンセル</button>
<button class="cfm-ok" type="button">公開する</button>
</div>
</main>
</body>
</html>
